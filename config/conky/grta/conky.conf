-- SelfCheckout rice — GRTA fullscreen desktop face
-- Written for the SelfCheckout rice.
-- Fullscreen 1920×1080 on eDP (primary). Solid black background with GRTA
-- drawn centered. HDMI unaffected — shows gsettings composite wallpaper.
--
-- NOTE: own_window_type = 'override' with ARGB visual triggers BadMatch on
-- this GNOME/Mutter + nvidia/amd combo. We use desktop type instead — same
-- visual result (below-all-app-windows layer) without the compositor fight.

conky.config = {
    alignment = 'top_left',
    gap_x = 0,
    gap_y = 0,
    -- No xinerama_head — span both monitors. Lua draws two face copies.

    background = true,
    update_interval = 1.0,
    double_buffer = true,

    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = false,
    own_window_colour = '000000',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    minimum_width = 3840,
    minimum_height = 1080,
    maximum_width = 3840,

    draw_shades = false,
    draw_outline = false,
    draw_borders = false,
    draw_graph_borders = false,
    uppercase = false,
    use_spacer = 'none',
    no_buffers = true,
    show_graph_scale = false,
    show_graph_range = false,

    lua_load = '~/.config/conky/grta/face.lua',
    lua_draw_hook_post = 'draw_grta',
}

conky.text = [[
]]
