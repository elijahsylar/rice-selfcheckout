# SelfCheckout Rice — Kitty terminal config
# Written for the SelfCheckout rice.
# Palette: phosphor green on black, amber as the only warm accent (see README).
# ANSI slot mapping mirrors the gnome-terminal SelfCheckout profile:
# monochrome-CRT philosophy — blue/magenta/cyan collapse to phosphor-green
# phantoms because the palette has no cool colors. Red and amber are the only
# non-green accents.

# ---- Font ----
font_family        VT323
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size          20
disable_ligatures  never

# ---- Colors ----
foreground          #c0ffcc
background          #000000
selection_foreground #00ff41
selection_background #0a0a0a

cursor              #00ff41
cursor_text_color   #000000
cursor_shape        block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

url_color           #00ff41
url_style           single

# ---- 16-color ANSI palette (matches gnome-terminal SelfCheckout profile) ----
# 0-7 normal
color0   #000000
color1   #ff0033
color2   #00cc33
color3   #ffaa00
color4   #2a4a2a
color5   #1a3a1a
color6   #4a7a5a
color7   #c0ffcc
# 8-15 bright
color8   #4a7a5a
color9   #ff0033
color10  #00ff41
color11  #ffaa00
color12  #4a7a5a
color13  #2a4a2a
color14  #c0ffcc
color15  #c0ffcc

# ---- Background image (CRT scanline tile) ----
background_image              scanline-tile.png
background_image_layout       tiled
background_image_linear       no
background_tint               0.0
background_opacity            0.90

# ---- Window ----
window_padding_width          8
window_border_width           1pt
active_border_color           #00ff41
inactive_border_color         #1a3a1a
draw_minimal_borders          yes
confirm_os_window_close       0
hide_window_decorations       yes

# ---- Tabs ----
tab_bar_edge                  bottom
tab_bar_style                 powerline
tab_powerline_style           slanted
tab_title_template            "{index}: {title}"
active_tab_foreground         #000000
active_tab_background         #00ff41
inactive_tab_foreground       #c0ffcc
inactive_tab_background       #0a0a0a
tab_bar_background            #000000

# ---- Bell ----
enable_audio_bell             no
visual_bell_duration          0.1
visual_bell_color             #00ff41

# ---- Scrollback ----
scrollback_lines              10000

# ---- Misc ----
allow_hyperlinks              yes
shell                         .
editor                        .
term                          xterm-kitty

# ---- Keybinds additions ----
# Ctrl+Shift+C/V for copy/paste (default, keeping for clarity)
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
# Ctrl+Shift+Enter — new window in current tab
map ctrl+shift+enter new_window_with_cwd
