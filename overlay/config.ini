# SelfCheckout Rice — CRT overlay config
# Written for the SelfCheckout rice.
#
# Opacity is the multiplier applied to the static-snow stack
# (grain + drift band + signal glitch), matching --crt-static-opacity in
# the CSS theme. Scanlines and vignette are NOT scaled by this and always render
# at their CSS-native strength (0.04 for scan pixels, 0.45 for vignette edge).

default_opacity = 0.18
battery_opacity = 0.05

# auto = read gsettings org.gnome.desktop.interface enable-animations
# on   = force reduced-motion frozen pattern
# off  = always animate
reduce_motion = auto

# How often to re-check battery + reduced-motion state (ms).
poll_ms = 2000

# Per-monitor bounds + opacity. Format: NAME:x,y,w,h:opacity
# NAME is informational; bounds are what matter (in root-window coords).
# Use `xrandr | grep ' connected'` to find your geometries.
monitor = eDP:0,0,1920,1080:0.18
monitor = HDMI-1-0:1920,0,1920,1080:0.10
